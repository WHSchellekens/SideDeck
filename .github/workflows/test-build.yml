name: Test build (debug APK)

# Builds the sidekick-tuning branch on every push and publishes the APK as the
# "sidekick-test" pre-release, so it can be downloaded straight onto a phone.
# A release build (optimized engine, like the store app) signed with a cached
# debug key: a debug build compiles the C++ engine at -O0, too slow for keylock
# in real time.
# Analyze and the tests run first; they don't block the APK, but a failure in
# any of them marks the run as failed.
#
# Run by hand (gh workflow run test-build.yml --ref sidekick-tuning -f ref=<commit>
# -f tag=<name>) it builds an older commit with the same debug key instead, for
# finding which change broke something, and publishes it as its own pre-release.

on:
  push:
    branches: [sidekick-tuning]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to build (empty = this branch)
        required: false
        default: ""
      tag:
        description: Pre-release tag for that build (empty = sidekick-test)
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: test-build-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      # Where the Android Gradle plugin keeps the debug signing key.
      ANDROID_USER_HOME: ${{ github.workspace }}/.android-user
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Same Flutter pin as the release workflow: the .metadata revision.
      - name: Install Flutter
        run: |
          set -euo pipefail
          rev=$(sed -n -E 's/.*revision: "(.*)"/\1/p' .metadata | head -n1)
          test -n "$rev"
          git clone --filter=blob:none https://github.com/flutter/flutter.git "$HOME/flutter"
          git -C "$HOME/flutter" fetch --depth 1 origin "$rev"
          git -C "$HOME/flutter" checkout --force FETCH_HEAD
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$HOME/flutter" >> "$GITHUB_ENV"

      - name: Flutter config
        run: |
          flutter config --no-analytics
          flutter --version

      # The same debug key every run, so each test build installs over the last.
      - name: Restore debug signing key
        id: keystore
        uses: actions/cache/restore@v4
        with:
          path: .android-user/debug.keystore
          key: sidedeck-debug-keystore-v1

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        if: ${{ !inputs.ref }}
        id: analyze
        continue-on-error: true
        run: flutter analyze

      - name: Dart tests
        if: ${{ !inputs.ref }}
        id: dart_tests
        continue-on-error: true
        run: flutter test

      - name: Engine tests (C++)
        if: ${{ !inputs.ref }}
        id: engine_tests
        continue-on-error: true
        run: |
          cmake -S native/engine -B build/native-tests
          cmake --build build/native-tests
          ctest --test-dir build/native-tests --output-on-failure

      # No key.properties here, so build.gradle.kts signs release with the debug key.
      - name: Build release APK (arm64, test key)
        run: flutter build apk --release --target-platform android-arm64

      - name: Save debug signing key
        if: steps.keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .android-user/debug.keystore
          key: sidedeck-debug-keystore-v1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sidedeck-test-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tag="${TAG:-sidekick-test}"
          apk="sidedeck-test.apk"
          title="SideDeck test build"
          if [ -n "$TAG" ]; then
            apk="sidedeck-$TAG.apk"
            title="SideDeck test build ($TAG)"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" "$apk" \
            --prerelease \
            --target "$sha" \
            --title "$title" \
            --notes "Build of ${sha::7} signed with a test key, for testing. Not a release."

      - name: Report checks
        if: steps.analyze.outcome == 'failure' || steps.dart_tests.outcome == 'failure' || steps.engine_tests.outcome == 'failure'
        run: |
          echo "analyze: ${{ steps.analyze.outcome }}"
          echo "dart tests: ${{ steps.dart_tests.outcome }}"
          echo "engine tests: ${{ steps.engine_tests.outcome }}"
          exit 1
