name: sidedeck
description: DJ deck for Android and iPhone. Local files and Subsonic.
publish_to: "none"
version: 1.1.4+10

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^13.0.1
  ffi: ^2.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  http: ^1.6.0
  crypto: ^3.0.7
  sqflite: ^2.4.3
  file_picker: 8.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/SpaceGrotesk-OFL.txt
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
